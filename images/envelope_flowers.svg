<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <filter id="flower-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#flower-shadow)">
    <!-- Dark Sage Leaves -->
    <path d="M 38 18 C 30 10 32 0 35 -4 C 40 -2 44 8 40 16 Z" fill="#475744" />
    <path d="M 55 22 C 65 14 74 12 78 14 C 77 20 68 26 58 26 Z" fill="#475744" />
    <path d="M 18 42 C 10 38 4 34 2 37 C 2 43 10 48 18 46 Z" fill="#475744" />
    <path d="M 65 52 C 78 56 86 52 88 56 C 84 62 74 62 62 56 Z" fill="#475744" />
    <path d="M 20 65 C 10 74 4 80 8 84 C 14 84 20 76 25 68 Z" fill="#475744" />

    <!-- Flower 2 (Top-Right Medium) -->
    <g transform="translate(56, 26) rotate(15)">
      <ellipse cx="0" cy="-12" rx="5" ry="8" fill="#FAF8F5" />
      <ellipse cx="11" cy="-4" rx="5" ry="8" transform="rotate(72 11 -4)" fill="#FAF8F5" />
      <ellipse cx="7" cy="10" rx="5" ry="8" transform="rotate(144 7 10)" fill="#FAF8F5" />
      <ellipse cx="-7" cy="10" rx="5" ry="8" transform="rotate(216 -7 10)" fill="#FAF8F5" />
      <ellipse cx="-11" cy="-4" rx="5" ry="8" transform="rotate(288 -11 -4)" fill="#FAF8F5" />
      <circle cx="0" cy="0" r="3.5" fill="#BFA167" />
    </g>

    <!-- Flower 3 (Right Small) -->
    <g transform="translate(70, 52) rotate(45)">
      <ellipse cx="0" cy="-9" rx="3.8" ry="6" fill="#FAF8F5" />
      <ellipse cx="8" cy="-3" rx="3.8" ry="6" transform="rotate(72 8 -3)" fill="#FAF8F5" />
      <ellipse cx="5" cy="7" rx="3.8" ry="6" transform="rotate(144 5 7)" fill="#FAF8F5" />
      <ellipse cx="-5" cy="7" rx="3.8" ry="6" transform="rotate(216 -5 7)" fill="#FAF8F5" />
      <ellipse cx="-8" cy="-3" rx="3.8" ry="6" transform="rotate(288 -8 -3)" fill="#FAF8F5" />
      <circle cx="0" cy="0" r="2.6" fill="#BFA167" />
    </g>

    <!-- Flower 1 (Bottom-Left Main Large) -->
    <g transform="translate(30, 50) rotate(-10)">
      <ellipse cx="0" cy="-16" rx="6.5" ry="10.5" fill="#FAF8F5" />
      <ellipse cx="15" cy="-5" rx="6.5" ry="10.5" transform="rotate(72 15 -5)" fill="#FAF8F5" />
      <ellipse cx="9" cy="13" rx="6.5" ry="10.5" transform="rotate(144 9 13)" fill="#FAF8F5" />
      <ellipse cx="-9" cy="13" rx="6.5" ry="10.5" transform="rotate(216 -9 13)" fill="#FAF8F5" />
      <ellipse cx="-15" cy="-5" rx="6.5" ry="10.5" transform="rotate(288 -15 -5)" fill="#FAF8F5" />
      <circle cx="0" cy="0" r="4.8" fill="#BFA167" />
